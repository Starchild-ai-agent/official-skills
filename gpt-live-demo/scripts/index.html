<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starchild · GPT-Live Voice Demo</title>
<style>
:root{--bg:#0b1512;--panel:#101d19;--line:#1d332c;--tx:#d7e8e1;--dim:#6b8a80;--acc:#4ade80;--err:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:17px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
#status{font-size:12px;color:var(--dim);min-height:18px;margin-bottom:8px}
#status.err{color:var(--err)}
button{background:#152822;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
#connect{background:var(--acc);color:#052e2b;font-weight:600;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;margin-bottom:12px}
#chat{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.bubble{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px}
.bubble.user{align-self:flex-end;background:#1b3a2f}
.bubble.agent{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
#log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;height:300px;overflow-y:auto;font:11px/1.6 ui-monospace,monospace}
.ev{margin-bottom:2px;white-space:pre-wrap;word-break:break-all}
.ev.sys{color:var(--dim)}.ev.deleg{color:var(--warn)}.ev.tool{color:#7dd3fc}
.ev.result{color:var(--acc)}.ev.err{color:var(--err)}.ev.raw{color:#a78bfa}
footer{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;margin-top:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4f48}
.dot.live{background:var(--acc)}
details.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0}
details.panel summary{cursor:pointer;font-size:13px;color:var(--acc)}
#promptTools pre{white-space:pre-wrap;font:11px/1.6 ui-monospace,monospace;background:#0d1714;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
#promptTools h3{font-size:12px;margin:10px 0 4px;color:var(--dim)}
#promptTools li{font-size:12px;margin:4px 0 4px 18px}
#promptTools code{color:#7dd3fc}
</style>
</head>
<body>
<h1>🐶 Starchild Voice</h1>
<div class="sub">GPT-Live voice layer · Starchild brain · client delegation · thread binding · zero tools on the Live side</div>
<div id="status">Not connected</div>
<div class="row">
  <button id="connect">Start Call</button>
  <button id="close" disabled>Hang Up</button>
</div>
<div id="chat"></div>
<details class="panel" id="promptPanel"><summary>System Prompt &amp; Tools</summary><div id="promptTools">Loading…</div></details>
<div id="log"></div>
<footer><span class="dot" id="micdot"></span><span id="mic">Microphone off</span></footer>

<script>
// WebRTC only. Every DataChannel event goes to the bridge; everything the bridge wants said or known comes back over SSE.
const $=id=>document.getElementById(id);
const chat=$("chat"),log=$("log"),status=$("status");
const Q=new URLSearchParams(location.search);
const BINDING=Q.get("binding")||"thread", THREAD=Q.get("thread_id")||"";
const base=location.pathname.replace(/\/?$/,"/");
let pc,dc,stream,connected=false,bridgeId=null,out=null;
if(THREAD)document.querySelector(".sub").textContent=`Bound to thread …${THREAD.slice(-12)} — open in a full tab (mic permission)`;
else{document.querySelector(".sub").textContent="Bound to the Live channel thread (server default) — open in a full tab (mic permission)";}

// Same-origin as the Starchild web app → reuse its persisted login token (redux-persist).
function userToken(){try{const r=JSON.parse(localStorage.getItem("persist:root")||"{}");const l=JSON.parse(r.logincache||"{}");return l.authToken||"";}catch{return "";}}
async function api(path,body,method){
  const tok=userToken();
  const r=await fetch(base+path,{method:method||(body?"POST":"GET"),headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.json().catch(()=>({error:"HTTP "+r.status}));throw new Error(e.error||("HTTP "+r.status));}
  return r.json();
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function addEv(cls,tag,body,raw){const d=document.createElement("div");d.className="ev "+cls;d.innerHTML=`<span class="t">${new Date().toLocaleTimeString()}</span><span class="tag">${tag}</span>${body}`;if(raw!==undefined){d.style.cursor="pointer";d.title="click to expand";d.addEventListener("click",()=>{let pre=d.querySelector("pre");if(pre){pre.remove();return;}pre=document.createElement("pre");pre.style.cssText="white-space:pre-wrap;word-break:break-all;font-size:11px;margin:4px 0 0;opacity:.85;max-height:300px;overflow:auto";pre.textContent=typeof raw==="string"?raw:JSON.stringify(raw,null,2);d.appendChild(pre);});}log.prepend(d);}
function addBubble(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function setStatus(t,err){status.textContent=t;status.classList.toggle("err",!!err);}

let userLine=null,liveLine=null;
function renderEvent(ev){
  const t=ev.type||"(unknown)";
  if(/input.*(transcript|transcription)/.test(t)){
    if(ev.delta){if(!userLine){userLine=document.createElement("div");userLine.className="msg user";chat.appendChild(userLine);}userLine.textContent+=ev.delta;chat.scrollTop=chat.scrollHeight;}
    if(/completed|done|final/.test(t)){if(userLine&&ev.transcript)userLine.textContent=ev.transcript;userLine=null;}
    return;
  }
  if(/output.*(transcript|transcription)/.test(t)){
    if(ev.delta){if(!liveLine){liveLine=document.createElement("div");liveLine.className="msg agent";chat.appendChild(liveLine);}liveLine.textContent+=ev.delta;chat.scrollTop=chat.scrollHeight;}
    if(/completed|done|final/.test(t))liveLine=null;
    return;
  }
  if(t==="session.delegation.created"){addEv("deleg","Delegation",`→ bridge (${BINDING})`);return;}
  if(/error/.test(t)){addEv("err","Error",esc(JSON.stringify(ev.error||ev)));return;}
  if(/speech_started/.test(t)){addEv("sys","VAD","user speaking");return;}
  if(!/delta|audio/.test(t))addEv("raw",t,"",ev);
}
function renderOut(msg){
  const k=msg.type.split(".")[1];
  addEv(k==="commentary"?"result":"tool",k,`${msg.delegation_id?`[${msg.delegation_id.slice(-6)}] `:""}${esc(msg.content.slice(0,200))}`,msg);
}

async function connect(){
  $("connect").disabled=true;
  try{
    setStatus("Requesting microphone…");
    if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia unavailable — open this page in a full browser tab over HTTPS (not inside an iframe)");
    stream=await Promise.race([
      navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Microphone request timed out (10s): the permission prompt may be hidden — open in a full tab, allow the mic in the address bar, close other Live tabs, then retry")),10000))
    ]);
    $("micdot").classList.add("on");$("mic").textContent="Microphone on";
    pc=new RTCPeerConnection();
    pc.ontrack=e=>{
      let a=$("remote");
      if(!a){a=document.createElement("audio");a.id="remote";a.autoplay=true;a.playsInline=true;document.body.appendChild(a);}
      a.srcObject=e.streams[0];
      a.play().then(()=>addEv("sys","Audio","remote track playing")).catch(err=>{addEv("err","Audio","play() blocked: "+err.message+" — click anywhere to resume");setStatus("Click the page to enable audio",true);document.addEventListener("click",()=>a.play().catch(()=>{}),{once:true});});
    };
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    dc=pc.createDataChannel("oai-events");
    dc.onmessage=e=>{let ev;try{ev=JSON.parse(e.data);}catch{return;}renderEvent(ev);if(bridgeId)fetch(base+`api/bridge/${bridgeId}/event`,{method:"POST",headers:{"Content-Type":"application/json"},body:e.data}).catch(()=>{});};
    dc.onopen=()=>addEv("sys","DataChannel","open");
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    await new Promise(r=>{if(pc.iceGatheringState==="complete")return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState==="complete"&&r();setTimeout(r,2000);});
    setStatus("Creating Live session…");
    const data=await api("api/session",{sdp:pc.localDescription.sdp,binding:BINDING,thread_id:THREAD||undefined});
    await pc.setRemoteDescription(data.transport?.sdp?{type:"answer",sdp:data.transport.sdp}:data.answer??data);
    bridgeId=data.bridge_id;
    out=new EventSource(base+`api/bridge/${bridgeId}/out`);
    out.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="bridge.sideband"){addEv("sys","sideband",m.open?"attached — server owns the control plane":"detached (attempt "+m.attempts+")");return;}if(m.mirror){renderOut(m);return;}if(!dc||dc.readyState!=="open")return;dc.send(e.data);renderOut(m);};
    const b=data.binding||{};
    if(b.session_id)addEv("result","Thread",`Bound to …${b.session_id.slice(-12)} — seeded ${b.snapshot_turns}/${b.thread_messages} msgs (${b.snapshot_chars} chars) · ${b.authed?"user-authed (persists to web thread)":"no user token (local session only)"}`);
    if(!b.authed)addEv("err","Auth","No login token found in this origin — turns will not appear in the web thread list. Open this page from the Starchild web app domain while signed in.");
    connected=true;$("close").disabled=false;
    setStatus(THREAD?"Connected to thread, start talking":"Connected, start talking");
  }catch(e){setStatus("Error: "+e.message,true);addEv("err","Error",esc(e.message));teardown();$("connect").disabled=false;}
}
function teardown(){
  try{out?.close();}catch{}
  if(bridgeId){fetch(base+`api/bridge/${bridgeId}`,{method:"DELETE",keepalive:true}).catch(()=>{});}
  try{dc?.close();}catch{}try{pc?.close();}catch{}
  const ra=$("remote");if(ra){ra.srcObject=null;ra.remove();}
  stream?.getTracks().forEach(t=>t.stop());
  dc=null;pc=null;out=null;bridgeId=null;connected=false;
  $("micdot").classList.remove("on");$("mic").textContent="Microphone off";
  $("close").disabled=true;$("connect").disabled=false;
}
$("connect").onclick=connect;
$("close").onclick=()=>{teardown();setStatus("Hung up");};
window.addEventListener("pagehide",()=>{if(connected||pc||dc)teardown();});
</script>
</body>
</html>
