// ============================================================
// Card Component
// ============================================================
function Card({ task, onClick, onDragStart, onDragEnd, isDone }) {
  const cf = task._custom_fields || {};
  const hasBadges = cf.priority || cf.status || (task.tags && task.tags.length > 0);
  const hasMeta = task.before || (task.checklist && task.checklist.length > 0) || (task.participants && task.participants.length > 0);
  const checkDone = (task.checklist || []).filter(c => c.value).length;
  const checkTotal = (task.checklist || []).length;
  const pct = checkTotal ? Math.round((checkDone / checkTotal) * 100) : 0;

  return (
    <div
      className={`card${isDone ? ' card-done' : ''}`}
      draggable
      onDragStart={(e) => { e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.setData('task-board', task.board_id || ''); e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); onDragStart && onDragStart(task); }}
      onDragEnd={(e) => { e.target.classList.remove('dragging'); onDragEnd && onDragEnd(); }}
      onClick={() => onClick(task)}
    >
      {isDone && <span className="done-badge">✓</span>}
      {cf.priority && (
        <div className="priority-dot" data-p={cf.priority} data-label={cf.priority} title={cf.priority} />
      )}
      <div className="card-title" style={{ paddingRight: cf.priority ? 20 : 0, paddingLeft: isDone ? 20 : 0 }}>{task.title}</div>
      {(task.tags && task.tags.length > 0) && (
        <div className="card-badges">
          {(task.tags || []).slice(0, 2).map(t => <span key={t} className="badge badge-tag">{t}</span>)}
        </div>
      )}
      {hasMeta && (
        <div className="card-meta">
          {task.before > 0 && (
            <span className={`card-due ${isOverdue(task.before) ? 'overdue' : ''}`}>
              <Icons.Clock />
              {formatDate(task.before)}
            </span>
          )}
          {checkTotal > 0 && (
            <span className="card-checklist">
              <div className="checklist-bar">
                <div className="checklist-bar-fill" style={{ width: `${pct}%`, background: pct === 100 ? 'var(--success)' : 'var(--primary)' }} />
              </div>
              {checkDone}/{checkTotal}
            </span>
          )}
          {task.participants && task.participants.length > 0 && (
            <div className="card-avatars">
              {task.participants.slice(0, 3).map((p, i) => (
                <div className="avatar-wrap" key={i} style={{ marginLeft: i > 0 ? '-6px' : 0, zIndex: 3 - i }}
                  onMouseEnter={(e) => showAvatarTip(e, p.user_id_or_mail, 'Assigned')}
                  onMouseLeave={hideAvatarTip}>
                  <div className="avatar">{(p.user_id_or_mail || '?')[0].toUpperCase()}</div>
                </div>
              ))}
              {task.participants.length > 3 && (
                <div className="avatar-wrap" style={{ marginLeft: '-6px', zIndex: 0 }}
                  onMouseEnter={(e) => showAvatarTip(e, task.participants.slice(3).map(p => p.user_id_or_mail).join(', '), 'Also assigned')}
                  onMouseLeave={hideAvatarTip}>
                  <div className="avatar" style={{ background: 'var(--surface-4)', color: 'var(--text-muted)', fontSize: 7 }}>
                    +{task.participants.length - 3}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ============================================================
// Task Detail Modal
// ============================================================
function TaskModal({ task, lists, onClose, onSave, onDelete }) {
  const [form, setForm] = useState({ ...task });
  const [tagInput, setTagInput] = useState('');
  const titleRef = useRef(null);

  useEffect(() => {
    setForm({ ...task });
    if (titleRef.current) titleRef.current.focus();
  }, [task]);

  const update = (key, val) => setForm(f => ({ ...f, [key]: val }));
  const updateCF = (key, val) => setForm(f => ({ ...f, _custom_fields: { ...(f._custom_fields || {}), [key]: val } }));

  const addTag = () => {
    const t = tagInput.trim();
    if (t && !(form.tags || []).includes(t)) {
      update('tags', [...(form.tags || []), t]);
    }
    setTagInput('');
  };
  const removeTag = (t) => update('tags', (form.tags || []).filter(x => x !== t));

  const toggleChecklist = (idx) => {
    const cl = [...(form.checklist || [])];
    cl[idx] = { ...cl[idx], value: !cl[idx].value };
    update('checklist', cl);
  };
  const updateChecklistText = (idx, text) => {
    const cl = [...(form.checklist || [])];
    cl[idx] = { ...cl[idx], text };
    update('checklist', cl);
  };
  const removeChecklistItem = (idx) => {
    const cl = [...(form.checklist || [])];
    cl.splice(idx, 1);
    update('checklist', cl);
  };
  const addChecklistItem = () => {
    update('checklist', [...(form.checklist || []), { text: '', value: false }]);
  };

  const handleSave = () => {
    onSave(form);
    onClose();
  };

  const cf = form._custom_fields || {};

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <input
            ref={titleRef}
            className="modal-title-input"
            value={form.title || ''}
            onChange={(e) => update('title', e.target.value)}
            placeholder="Task title"
          />
          <button className="modal-close" onClick={onClose}>&times;</button>
        </div>
        <div className="modal-body">
          {/* Row: Column, Owner, Priority, Status */}
          <div className="modal-row" style={{ marginBottom: 14 }}>
            <div className="modal-field field-sm">
              <label>Column</label>
              <select value={form.list_id || ''} onChange={(e) => update('list_id', e.target.value)}>
                {lists.map(l => <option key={l.id} value={l.id}>{l.title}</option>)}
              </select>
            </div>
            <div className="modal-field field-grow">
              <label>Owners</label>
              <div className="multi-owner-field">
                {(form.participants || []).map((p, i) => (
                  <span key={i} className="owner-chip">
                    {p.user_id_or_mail}
                    <button onClick={() => update('participants', form.participants.filter((_, j) => j !== i))}>×</button>
                  </span>
                ))}
                <input
                  type="text"
                  placeholder="Add owner & press Enter"
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' || e.key === ',') {
                      e.preventDefault();
                      const val = e.target.value.trim();
                      if (val && !(form.participants || []).some(p => p.user_id_or_mail === val)) {
                        update('participants', [...(form.participants || []), { user_id_or_mail: val }]);
                      }
                      e.target.value = '';
                    }
                  }}
                />
              </div>
            </div>
            <div className="modal-field field-sm">
              <label>Priority</label>
              <select value={cf.priority || ''} onChange={(e) => updateCF('priority', e.target.value)}>
                <option value="">None</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>

          </div>

          {/* Dates */}
          <div className="modal-row" style={{ marginBottom: 14 }}>
            <div className="modal-field">
              <label>Start Date</label>
              <input type="date" value={tsToDateInput(form.start)} onChange={(e) => update('start', dateInputToTs(e.target.value))} />
            </div>
            <div className="modal-field">
              <label>Due Date</label>
              <input type="date" value={tsToDateInput(form.before)} onChange={(e) => update('before', dateInputToTs(e.target.value))} />
            </div>
          </div>

          {/* Description */}
          <div className="modal-section">
            <div className="modal-section-title">Description</div>
            <textarea
              className="modal-desc"
              value={(form.description && form.description.original_str) || ''}
              onChange={(e) => update('description', { original_str: e.target.value })}
              placeholder="Add a description..."
            />
          </div>

          {/* Links */}
          <div className="modal-section">
            <div className="modal-section-title">Links</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <div style={{
                display: 'flex', flexDirection: 'column', gap: 4,
                maxHeight: 200, overflowY: 'auto',
                paddingRight: ((form._custom_fields || {}).links || []).length > 4 ? 4 : 0
              }}>
              {((form._custom_fields || {}).links || []).map((link, i) => {
                let display = link;
                try { const u = new URL(link); display = u.hostname + (u.pathname !== '/' ? u.pathname : ''); } catch(e) {}
                return (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 8,
                    background: 'var(--surface-2)', border: '1px solid var(--border)',
                    borderRadius: 'var(--radius-sm)', padding: '7px 10px'
                  }}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ color: 'var(--primary)', flexShrink: 0 }}>
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <a href={link} target="_blank" rel="noopener noreferrer"
                      style={{ flex: 1, fontSize: 13, color: 'var(--text)', textDecoration: 'none',
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}
                      onMouseEnter={e => e.target.style.color = 'var(--primary)'}
                      onMouseLeave={e => e.target.style.color = 'var(--text)'}
                      title={link}
                    >{display}</a>
                    <span style={{ fontSize: 16, cursor: 'pointer', color: 'var(--text-muted)', lineHeight: 1, flexShrink: 0 }}
                      onClick={() => {
                        const links = ((form._custom_fields || {}).links || []).filter((_, idx) => idx !== i);
                        updateCF('links', links);
                      }}>&times;</span>
                  </div>
                );
              })}
              </div>
              <input
                style={{
                  padding: '7px 10px', background: 'var(--surface-2)',
                  border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)',
                  fontSize: 13, color: 'var(--text)', outline: 'none',
                  fontFamily: 'var(--font)', width: '100%',
                  transition: 'border-color 0.15s'
                }}
                placeholder="Paste a URL and press Enter…"
                onFocus={e => e.target.style.borderColor = 'var(--primary)'}
                onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.07)'}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = e.target.value.trim();
                    if (val) {
                      const links = [...((form._custom_fields || {}).links || []), val];
                      updateCF('links', links);
                      e.target.value = '';
                    }
                  }
                }}
              />
            </div>
          </div>

          {/* Tags */}
          <div className="modal-section">
            <div className="modal-section-title">Tags</div>
            <div className="modal-tags">
              {(form.tags || []).map(t => (
                <span key={t} className="modal-tag">
                  {t}
                  <span className="modal-tag-remove" onClick={() => removeTag(t)}>&times;</span>
                </span>
              ))}
              <input
                className="modal-tag-input"
                value={tagInput}
                onChange={(e) => setTagInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } }}
                placeholder="Add tag..."
              />
            </div>
          </div>

          {/* Checklist */}
          <div className="modal-section">
            <div className="modal-section-title">Checklist</div>
            {(form.checklist || []).map((item, idx) => (
              <div key={idx} className="checklist-item">
                <input type="checkbox" checked={item.value} onChange={() => toggleChecklist(idx)} />
                <input
                  type="text"
                  value={item.text}
                  onChange={(e) => updateChecklistText(idx, e.target.value)}
                  placeholder="Checklist item..."
                  style={{ textDecoration: item.value ? 'line-through' : 'none', color: item.value ? '#ccc' : 'var(--text)' }}
                />
                <button className="remove-btn" onClick={() => removeChecklistItem(idx)}>&times;</button>
              </div>
            ))}
            <button className="add-checklist-btn" onClick={addChecklistItem}>+ Add item</button>
          </div>

          {/* Actions */}
          <div className="modal-actions">
            <button className="btn btn-danger" onClick={() => { onDelete(form); onClose(); }}>Delete</button>
            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Board View
// ============================================================
function BoardView({ lists, tasks, onCardClick, onAddTask, onAddColumn, onSaveTask, onDeleteColumn, onRenameColumn, onReorderColumn, onDragStart, onDragEnd }) {
  const [addingCardTo, setAddingCardTo] = useState(null);
  const [newCardTitle, setNewCardTitle] = useState('');
  const [addingColumn, setAddingColumn] = useState(false);
  const [newColTitle, setNewColTitle] = useState('');
  const [dragOverCol, setDragOverCol] = useState(null);
  const [draggingCol, setDraggingCol] = useState(null);
  const [colDragOver, setColDragOver] = useState(null);
  const [menuOpen, setMenuOpen] = useState(null);
  const [renamingCol, setRenamingCol] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const inputRef = useRef(null);
  const colInputRef = useRef(null);
  const renameRef = useRef(null);

  useEffect(() => {
    if (addingCardTo && inputRef.current) inputRef.current.focus();
  }, [addingCardTo]);

  useEffect(() => {
    if (!menuOpen) return;
    const close = () => setMenuOpen(null);
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [menuOpen]);

  useEffect(() => {
    if (addingColumn && colInputRef.current) colInputRef.current.focus();
  }, [addingColumn]);

  const sortedLists = useMemo(() => [...lists].sort((a, b) => (a.order || '').localeCompare(b.order || '')), [lists]);

  const handleDrop = (e, listId) => {
    e.preventDefault();
    setDragOverCol(null);
    // If dragging a column, reorder it
    const colId = e.dataTransfer.getData('col-drag');
    if (colId && colId !== listId) {
      setColDragOver(null);
      setDraggingCol(null);
      onReorderColumn && onReorderColumn(colId, listId);
      return;
    }
    const taskId = e.dataTransfer.getData('text/plain');
    const task = tasks.find(t => t.id === taskId);
    if (task && task.list_id !== listId) {
      onSaveTask({ ...task, list_id: listId });
    }
  };

  const handleAddCard = (listId) => {
    if (!newCardTitle.trim()) return;
    onAddTask(listId, newCardTitle.trim());
    setNewCardTitle('');
    setAddingCardTo(null);
  };

  const handleAddColumn = () => {
    if (!newColTitle.trim()) return;
    onAddColumn(newColTitle.trim());
    setNewColTitle('');
    setAddingColumn(false);
  };

  return (
    <div className="board-container">
      {sortedLists.map(list => {
        const colTasks = tasks.filter(t => t.list_id === list.id && !t.archived);
        return (
          <div
            key={list.id}
            className={`column ${dragOverCol === list.id ? 'drag-over' : ''} ${colDragOver === list.id && draggingCol !== list.id ? 'col-drag-over' : ''} ${draggingCol === list.id ? 'col-dragging' : ''}`}
            onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (e.dataTransfer.types.includes('col-drag')) { setColDragOver(list.id); } else { setDragOverCol(list.id); } }}
            onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) { setDragOverCol(null); setColDragOver(null); } }}
            onDrop={(e) => handleDrop(e, list.id)}
          >
            <div
              className="column-header"
              draggable
              onDragStart={(e) => { e.dataTransfer.setData('col-drag', list.id); e.dataTransfer.effectAllowed = 'move'; setDraggingCol(list.id); }}
              onDragEnd={() => { setDraggingCol(null); setColDragOver(null); }}
              style={{ cursor: 'grab' }}
            >
              <div className="column-color-bar" style={{ background: list.color || '#aaa' }} />
              {renamingCol === list.id ? (
                <input
                  ref={renameRef}
                  className="column-rename-input"
                  value={renameValue}
                  onChange={(e) => setRenameValue(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') { onRenameColumn(list.id, renameValue); setRenamingCol(null); }
                    if (e.key === 'Escape') setRenamingCol(null);
                  }}
                  onBlur={() => { if (renameValue.trim()) onRenameColumn(list.id, renameValue); setRenamingCol(null); }}
                  autoFocus
                />
              ) : (
                <span className="column-title">{list.title}</span>
              )}
              <span className="column-count">{colTasks.length}</span>
              <div style={{ position: 'relative' }}>
                <button className="column-menu-btn" onClick={(e) => { e.stopPropagation(); setMenuOpen(menuOpen === list.id ? null : list.id); }}>
                  <Icons.MoreHorizontal />
                </button>
                {menuOpen === list.id && (
                  <div className="column-dropdown" onClick={(e) => e.stopPropagation()}>
                    <div className="dropdown-item" onClick={() => { setRenamingCol(list.id); setRenameValue(list.title); setMenuOpen(null); }}>Rename</div>
                    <div className="dropdown-item danger" onClick={() => { onDeleteColumn(list.id); setMenuOpen(null); }}>Delete column</div>
                  </div>
                )}
              </div>
            </div>
            <div className="column-cards">
              {colTasks.sort((a, b) => (a.order || '').localeCompare(b.order || '')).map(task => (
                <Card key={task.id} task={task} onClick={onCardClick} isDone={list.title.trim().toLowerCase() === 'done'}
                  onDragStart={onDragStart} onDragEnd={onDragEnd} />
              ))}
            </div>
            <div className="add-card-area">
              {addingCardTo === list.id ? (
                <input
                  ref={inputRef}
                  className="add-card-input"
                  value={newCardTitle}
                  onChange={(e) => setNewCardTitle(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') handleAddCard(list.id); if (e.key === 'Escape') { setAddingCardTo(null); setNewCardTitle(''); } }}
                  onBlur={() => { if (!newCardTitle.trim()) { setAddingCardTo(null); setNewCardTitle(''); } }}
                  placeholder="Enter a title..."
                />
              ) : (
                <button className="add-card-btn" onClick={() => setAddingCardTo(list.id)}>
                  <Icons.Plus /> Add task
                </button>
              )}
            </div>
          </div>
        );
      })}
      <div className="add-column">
        {addingColumn ? (
          <input
            ref={colInputRef}
            className="add-column-input"
            value={newColTitle}
            onChange={(e) => setNewColTitle(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') handleAddColumn(); if (e.key === 'Escape') { setAddingColumn(false); setNewColTitle(''); } }}
            onBlur={() => { if (!newColTitle.trim()) { setAddingColumn(false); setNewColTitle(''); } }}
            placeholder="Column title..."
          />
        ) : (
          <button className="add-column-btn" onClick={() => setAddingColumn(true)}>
            <Icons.Plus /> Add Column
          </button>
        )}
      </div>
    </div>
  );
}

// ============================================================
// List View
// ============================================================
function ListView({ lists, tasks, onCardClick, onDragStart, onDragEnd }) {
  const sortedLists = useMemo(() => [...lists].sort((a, b) => (a.order || '').localeCompare(b.order || '')), [lists]);

  return (
    <div className="list-view">
      {sortedLists.map(list => {
        const colTasks = tasks.filter(t => t.list_id === list.id && !t.archived);
        if (colTasks.length === 0) return null;
        return (
          <div key={list.id} className="list-group">
            <div className="list-group-header">
              <div className="list-group-color" style={{ background: list.color || '#aaa' }} />
              <span className="list-group-title">{list.title}</span>
              <span className="list-group-count">{colTasks.length} tasks</span>
            </div>
            <table className="list-table">
              <thead>
                <tr>
                  <th style={{ width: '40%' }}>Title</th>
                  <th style={{ width: '15%' }}>Owners</th>
                  <th style={{ width: '15%' }}>Priority</th>
                  <th style={{ width: '15%' }}>Due Date</th>
                  <th style={{ width: '15%' }}>Tags</th>
                </tr>
              </thead>
              <tbody>
                {colTasks.sort((a, b) => (a.order || '').localeCompare(b.order || '')).map(task => {
                  const cf = task._custom_fields || {};
                  return (
                    <tr
                      key={task.id}
                      draggable
                      onClick={() => onCardClick(task)}
                      onDragStart={(e) => {
                        e.dataTransfer.setData('text/plain', task.id);
                        e.dataTransfer.setData('task-board', task.board_id || '');
                        e.dataTransfer.effectAllowed = 'move';
                        e.currentTarget.style.opacity = '0.45';
                        onDragStart && onDragStart(task);
                      }}
                      onDragEnd={(e) => {
                        e.currentTarget.style.opacity = '';
                        onDragEnd && onDragEnd();
                      }}
                      style={{ cursor: 'grab' }}
                    >
                      <td className="task-title-cell">{task.title}</td>
                      <td>
                        <div className="cell-flex">
                          {(task.participants || []).slice(0, 4).map((p, i) => (
                            <span key={i} className="owner-chip" style={{ fontSize: 11 }}>{p.user_id_or_mail}</span>
                          ))}
                          {task.participants && task.participants.length > 4 && (
                            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>+{task.participants.length - 4}</span>
                          )}
                        </div>
                      </td>
                      <td>
                        {cf.priority
                          ? <span className={`badge ${PRIORITY_COLORS[cf.priority] || ''}`}>{cf.priority}</span>
                          : <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>—</span>}
                      </td>
                      <td>
                        {task.before > 0
                          ? <span className={`card-due ${isOverdue(task.before) ? 'overdue' : ''}`}>{formatDate(task.before)}</span>
                          : <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>—</span>}
                      </td>
                      <td>
                        <div className="cell-flex">
                          {(task.tags || []).slice(0, 3).map(t => <span key={t} className="badge badge-tag">{t}</span>)}
                          {task.tags && task.tags.length > 3 && (
                            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>+{task.tags.length - 3}</span>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })}
      {sortedLists.every(l => tasks.filter(t => t.list_id === l.id && !t.archived).length === 0) && (
        <div className="empty-state">No tasks to display.</div>
      )}
    </div>
  );
}

// ============================================================
// Calendar View
// ============================================================
function CalendarView({ tasks, lists, onCardClick, onSaveTask }) {
  const [viewDate, setViewDate] = useState(new Date());
  const [dragOverCell, setDragOverCell] = useState(null); // ISO date string "YYYY-MM-DD"
  const [draggingId, setDraggingId] = useState(null);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const totalDays = lastDay.getDate();

  const cells = [];
  const prevMonth = new Date(year, month, 0);
  for (let i = startOffset - 1; i >= 0; i--) {
    cells.push({ day: prevMonth.getDate() - i, otherMonth: true, date: new Date(year, month - 1, prevMonth.getDate() - i) });
  }
  for (let d = 1; d <= totalDays; d++) {
    cells.push({ day: d, otherMonth: false, date: new Date(year, month, d) });
  }
  const remaining = 42 - cells.length;
  for (let d = 1; d <= remaining; d++) {
    cells.push({ day: d, otherMonth: true, date: new Date(year, month + 1, d) });
  }

  const today = new Date();
  const isToday = (date) => date.getDate() === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();

  const cellKey = (date) => `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;

  const getTasksForDate = (date) => {
    const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime() / 1000;
    const dayEnd = dayStart + 86400;
    return tasks.filter(t => t.before && t.before >= dayStart && t.before < dayEnd && !t.archived);
  };

  const getListColor = (listId) => {
    const list = lists.find(l => l.id === listId);
    return list ? list.color : '#f84600';
  };

  const handleDrop = (date) => {
    const task = tasks.find(t => t.id === draggingId);
    if (!task) return;
    // noon on the target date to avoid timezone edge cases
    const newTs = Math.floor(new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0).getTime() / 1000);
    onSaveTask({ ...task, before: newTs });
    setDraggingId(null);
    setDragOverCell(null);
  };

  return (
    <div className="calendar-view">
      <div className="calendar-controls">
        <button className="calendar-nav" onClick={() => setViewDate(new Date(year, month - 1, 1))}><Icons.ChevronLeft /></button>
        <button className="calendar-nav" onClick={() => setViewDate(new Date(year, month + 1, 1))}><Icons.ChevronRight /></button>
        <h3>{monthNames[month]} {year}</h3>
        <button className="calendar-today-btn" onClick={() => setViewDate(new Date())}>Today</button>
      </div>
      <div className="calendar-grid">
        {dayNames.map(d => <div key={d} className="calendar-day-header">{d}</div>)}
        {cells.map((cell, idx) => {
          const key = cellKey(cell.date);
          const isOver = dragOverCell === key;
          return (
            <div
              key={idx}
              className={`calendar-cell ${cell.otherMonth ? 'other-month' : ''} ${isToday(cell.date) ? 'today' : ''} ${isOver ? 'cal-drop-over' : ''}`}
              onDragOver={(e) => { e.preventDefault(); setDragOverCell(key); }}
              onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverCell(null); }}
              onDrop={(e) => { e.preventDefault(); handleDrop(cell.date); }}
            >
              <div className="calendar-date">{cell.day}</div>
              {getTasksForDate(cell.date).map(task => (
                <div
                  key={task.id}
                  className={`calendar-task ${draggingId === task.id ? 'cal-task-dragging' : ''}`}
                  style={{ background: getListColor(task.list_id) }}
                  draggable
                  onDragStart={(e) => { e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.effectAllowed = 'move'; setDraggingId(task.id); }}
                  onDragEnd={() => { setDraggingId(null); setDragOverCell(null); }}
                  onClick={() => onCardClick(task)}
                  title={task.title}
                >
                  {task.title}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// Timeline View
// ============================================================
function TimelineView({ tasks, lists, onCardClick }) {
  const activeTasks = tasks.filter(t => !t.archived && (t.start || t.before));

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const startDate = new Date(today);
  startDate.setDate(startDate.getDate() - 7);
  const totalDays = 35;
  const days = [];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(startDate);
    d.setDate(d.getDate() + i);
    days.push(d);
  }

  const dayWidth = 36;

  const getListColor = (listId) => {
    const list = lists.find(l => l.id === listId);
    return list ? list.color : '#f84600';
  };

  const getBarStyle = (task) => {
    const startTs = task.start || task.before;
    const endTs = task.before || task.start;
    const barStart = new Date(startTs * 1000);
    barStart.setHours(0, 0, 0, 0);
    const barEnd = new Date(endTs * 1000);
    barEnd.setHours(0, 0, 0, 0);

    const sOffset = Math.round((barStart - startDate) / (86400 * 1000));
    const eOffset = Math.round((barEnd - startDate) / (86400 * 1000));
    const left = Math.max(0, sOffset) * dayWidth;
    const width = Math.max(1, eOffset - Math.max(0, sOffset) + 1) * dayWidth - 4;

    return { left: `${left + 2}px`, width: `${width}px`, background: getListColor(task.list_id) };
  };

  const isSameDay = (d1, d2) => d1.getDate() === d2.getDate() && d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear();

  return (
    <div className="timeline-view">
      <div style={{ background: 'var(--white)', borderRadius: 'var(--radius)', boxShadow: 'var(--shadow-sm)', overflow: 'hidden' }}>
        <div className="timeline-header">
          <div className="timeline-label-col">Task</div>
          <div className="timeline-days">
            {days.map((d, i) => (
              <div key={i} className={`timeline-day-header ${isSameDay(d, new Date()) ? 'today' : ''}`} style={{ minWidth: dayWidth }}>
                <div>{dayNames[d.getDay()]}</div>
                <div className="day-num">{d.getDate()}</div>
              </div>
            ))}
          </div>
        </div>
        {activeTasks.map(task => (
          <div key={task.id} className="timeline-row">
            <div className="timeline-task-label" onClick={() => onCardClick(task)}>{task.title}</div>
            <div className="timeline-bar-area">
              {days.map((d, i) => (
                <div key={i} className={`timeline-bar-cell ${isSameDay(d, new Date()) ? 'today' : ''}`} style={{ minWidth: dayWidth }} />
              ))}
              <div className="timeline-bar" style={getBarStyle(task)} onClick={() => onCardClick(task)} title={task.title} />
            </div>
          </div>
        ))}
        {activeTasks.length === 0 && (
          <div className="empty-state">
            No tasks with dates to display. Add start or due dates to see tasks on the timeline.
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// Dashboard View
// ============================================================
function DashboardView({ tasks, lists }) {
  const active = tasks.filter(t => !t.archived);
  const overdue = active.filter(t => t.before && isOverdue(t.before));
  const withDue = active.filter(t => t.before > 0);
  const completed = active.filter(t => (t._custom_fields || {}).status === 'done');

  const sortedLists = [...lists].sort((a, b) => (a.order || '').localeCompare(b.order || ''));

  const colData = sortedLists.map(l => ({
    label: l.title,
    count: active.filter(t => t.list_id === l.id).length,
    color: l.color || '#aaa',
  }));
  const maxColCount = Math.max(...colData.map(d => d.count), 1);

  const priorities = ['high', 'medium', 'low'];
  const priorityColors = { high: '#ff5154', medium: '#ff8607', low: '#04aa11' };
  const priData = priorities.map(p => ({
    label: p.charAt(0).toUpperCase() + p.slice(1),
    count: active.filter(t => (t._custom_fields || {}).priority === p).length,
    color: priorityColors[p],
  }));
  const maxPriCount = Math.max(...priData.map(d => d.count), 1);

  const barChartHeight = 160;
  const barWidth = 36;
  const barGap = 18;

  const renderBarChart = (data, maxVal, title) => {
    const chartWidth = data.length * (barWidth + barGap) + barGap;
    return (
      <div className="chart-card">
        <div className="chart-title">{title}</div>
        <svg width="100%" height={barChartHeight + 36} viewBox={`0 0 ${Math.max(chartWidth, 180)} ${barChartHeight + 36}`}>
          {[0, 0.25, 0.5, 0.75, 1].map(frac => (
            <line key={frac} x1="0" y1={barChartHeight - frac * barChartHeight} x2={chartWidth} y2={barChartHeight - frac * barChartHeight} stroke="var(--grey-light)" strokeWidth="1" />
          ))}
          {data.map((d, i) => {
            const height = maxVal > 0 ? (d.count / maxVal) * (barChartHeight - 20) : 0;
            const x = barGap + i * (barWidth + barGap);
            const y = barChartHeight - height;
            return (
              <g key={i}>
                <rect x={x} y={y} width={barWidth} height={height} rx="4" fill={d.color} opacity="0.9">
                  <animate attributeName="height" from="0" to={height} dur="0.4s" fill="freeze" />
                  <animate attributeName="y" from={barChartHeight} to={y} dur="0.4s" fill="freeze" />
                </rect>
                <text x={x + barWidth / 2} y={y - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--text)">{d.count}</text>
                <text x={x + barWidth / 2} y={barChartHeight + 14} textAnchor="middle" fontSize="9" fill="var(--grey-dark)" fontWeight="500">{d.label.length > 8 ? d.label.slice(0,8) + '..' : d.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
    );
  };

  return (
    <div className="dashboard-view">
      <div className="dashboard-stats">
        <div className="stat-card">
          <div className="stat-label">Total Tasks</div>
          <div className="stat-value">{active.length}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Completed</div>
          <div className="stat-value" style={{ color: 'var(--success)' }}>{completed.length}</div>
        </div>
        <div className={`stat-card ${overdue.length > 0 ? 'overdue' : ''}`}>
          <div className="stat-label">Overdue</div>
          <div className="stat-value">{overdue.length}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">With Due Date</div>
          <div className="stat-value">{withDue.length}</div>
        </div>
      </div>
      <div className="dashboard-charts">
        {renderBarChart(colData, maxColCount, 'Tasks by Column')}
        {renderBarChart(priData, maxPriCount, 'Tasks by Priority')}
      </div>
    </div>
  );
}

// ============================================================
// Overview View
// ============================================================
function OverviewView({ tasks, lists, board }) {
  const active = tasks.filter(t => !t.archived);
  const overdue = active.filter(t => t.before && isOverdue(t.before));
  const completed = active.filter(t => (t._custom_fields || {}).status === 'done');
  const total = active.length;
  const pctDone = total > 0 ? Math.round((completed.length / total) * 100) : 0;

  let health = 'green';
  let healthLabel = 'On Track';
  let healthDesc = 'Project is progressing well with no blockers.';
  if (overdue.length > 0 && overdue.length <= 2) {
    health = 'yellow';
    healthLabel = 'At Risk';
    healthDesc = `${overdue.length} task(s) overdue. Review priorities and deadlines.`;
  }
  if (overdue.length > 2) {
    health = 'red';
    healthLabel = 'Off Track';
    healthDesc = `${overdue.length} tasks overdue. Immediate attention required.`;
  }

  const healthColors = { green: 'var(--success)', yellow: 'var(--warning)', red: 'var(--error)' };

  const sortedLists = [...lists].sort((a, b) => (a.order || '').localeCompare(b.order || ''));

  const milestones = active
    .filter(t => t.before > 0)
    .sort((a, b) => a.before - b.before)
    .slice(0, 8);

  return (
    <div className="overview-view">
      <div className="overview-health">
        <div className="health-dot" style={{ background: healthColors[health] }} />
        <div className="health-text">
          <h3>{healthLabel}</h3>
          <p>{healthDesc}</p>
        </div>
      </div>

      <div className="overview-section">
        <h4>Progress by Column</h4>
        <div className="overview-progress">
          {sortedLists.map(list => {
            const count = active.filter(t => t.list_id === list.id).length;
            const pct = total > 0 ? Math.round((count / total) * 100) : 0;
            return (
              <div key={list.id} className="progress-row">
                <span className="progress-label">{list.title}</span>
                <div className="progress-bar-bg">
                  <div className="progress-bar-fill" style={{ width: `${pct}%`, background: list.color || '#aaa' }} />
                </div>
                <span className="progress-pct">{pct}%</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="overview-section">
        <h4>Overall Completion</h4>
        <div className="overview-progress">
          <div className="progress-row">
            <span className="progress-label">Completed</span>
            <div className="progress-bar-bg">
              <div className="progress-bar-fill" style={{ width: `${pctDone}%`, background: 'var(--success)' }} />
            </div>
            <span className="progress-pct">{pctDone}%</span>
          </div>
        </div>
      </div>

      <div className="overview-section">
        <h4>Milestones</h4>
        {milestones.length === 0 && (
          <div className="empty-state" style={{ padding: 16 }}>No milestones with due dates.</div>
        )}
        {milestones.map(task => {
          const isOD = isOverdue(task.before);
          const isDone = (task._custom_fields || {}).status === 'done';
          return (
            <div key={task.id} className="milestone">
              <div className="milestone-dot" style={{ background: isOD ? 'var(--error)' : isDone ? 'var(--success)' : 'var(--primary)' }} />
              <span className="milestone-text" style={{ textDecoration: isDone ? 'line-through' : 'none', color: isDone ? '#aaa' : 'var(--text)' }}>{task.title}</span>
              <span className="milestone-date" style={{ color: isOD ? 'var(--error)' : 'var(--grey-dark)', fontWeight: isOD ? 600 : 400 }}>
                {formatDate(task.before)}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// Sidebar Component
// ============================================================
function Sidebar({ boards, activeBoard, taskCount, activeView, onViewChange, onBoardSelect, onCreateBoard, onDeleteBoard, onRenameBoard, allLists, draggingTask, onCrossBoardDrop }) {
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [dropOverBoard, setDropOverBoard] = useState(null);
  const [dropOverCol, setDropOverCol] = useState(null);
  const createRef = useRef(null);
  const renameRef = useRef(null);

  useEffect(() => { if (creating && createRef.current) createRef.current.focus(); }, [creating]);
  useEffect(() => { if (renamingId && renameRef.current) renameRef.current.focus(); }, [renamingId]);

  const handleCreate = () => {
    if (!newName.trim()) return;
    onCreateBoard(newName.trim());
    setNewName('');
    setCreating(false);
  };

  const navItems = [
    { id: 'board', label: 'Board', icon: Icons.Board },
    { id: 'list', label: 'List', icon: Icons.List },
    { id: 'calendar', label: 'Calendar', icon: Icons.Calendar },
    { id: 'timeline', label: 'Timeline', icon: Icons.Timeline },
    { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
    { id: 'overview', label: 'Overview', icon: Icons.Overview },
  ];

  const isCrossBoard = (b) => draggingTask && activeBoard && b.id !== activeBoard.id;

  return (
    <div className="sidebar">
      <div className="sidebar-brand">
        <img src={`${API_BASE}/favicon.png`} alt="" className="sidebar-brand-logo" />
        <span className="sidebar-brand-text">Starchild Work</span>
      </div>

      <div className="sidebar-section">
        <div className="sidebar-section-label">
          Projects
          <span className="sidebar-add-btn" onClick={() => setCreating(true)} title="New project">+</span>
        </div>
        {(boards || []).map(b => {
          const isActive = activeBoard && activeBoard.id === b.id;
          const count = isActive ? taskCount : '';
          const cross = isCrossBoard(b);
          const boardCols = (allLists[b.id] || []).sort((a, z) => (a.order || '').localeCompare(z.order || ''));
          const expanded = cross && dropOverBoard === b.id;

          return (
            <div
              key={b.id}
              onDragOver={(e) => { if (cross) { e.preventDefault(); setDropOverBoard(b.id); } }}
              onDragLeave={(e) => { if (cross && !e.currentTarget.contains(e.relatedTarget)) { setDropOverBoard(null); setDropOverCol(null); } }}
              onDrop={(e) => {
                if (!cross) return;
                e.preventDefault();
                e.stopPropagation();
                // dropped on board row itself (not a specific column) — do nothing
                setDropOverBoard(null);
                setDropOverCol(null);
              }}
            >
              <div
                className={`sidebar-item ${isActive ? 'active' : ''} ${cross && dropOverBoard === b.id ? 'cross-drop-hover' : ''}`}
                onClick={() => !draggingTask && onBoardSelect(b)}
                style={{ gap: 8 }}
                onDoubleClick={(e) => { e.stopPropagation(); setRenamingId(b.id); setRenameValue(b.title); }}
              >
                {renamingId === b.id ? (
                  <input
                    ref={renameRef}
                    className="sidebar-rename-input"
                    value={renameValue}
                    onChange={(e) => setRenameValue(e.target.value)}
                    onClick={(e) => e.stopPropagation()}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') { onRenameBoard(b.id, renameValue); setRenamingId(null); }
                      if (e.key === 'Escape') setRenamingId(null);
                    }}
                    onBlur={() => { if (renameValue.trim()) onRenameBoard(b.id, renameValue); setRenamingId(null); }}
                  />
                ) : (
                  <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.title}</span>
                )}
                {cross && <span style={{ fontSize: 9, color: 'var(--primary)', fontWeight: 700, letterSpacing: '0.5px', marginLeft: 'auto', flexShrink: 0 }}>DROP →</span>}
                {count && !renamingId && !cross && <span className="sidebar-item-count">{count}</span>}
                {boards.length > 1 && !renamingId && !draggingTask && (
                  <span className="sidebar-delete-btn" onClick={(e) => { e.stopPropagation(); onDeleteBoard(b.id); }} title="Delete project">&times;</span>
                )}
              </div>

              {/* Cross-board column drop targets — always visible for cross-board when hovering */}
              {cross && boardCols.length > 0 && (
                <div style={{ marginLeft: 12, marginBottom: 4, display: dropOverBoard === b.id ? 'block' : 'none' }}>
                  {boardCols.map(col => (
                    <div
                      key={col.id}
                      className={`cross-col-drop ${dropOverCol === col.id ? 'active' : ''}`}
                      onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDropOverCol(col.id); }}
                      onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDropOverCol(null); }}
                      onDrop={(e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const taskId = e.dataTransfer.getData('text/plain');
                        if (taskId && draggingTask && draggingTask.id === taskId) {
                          onCrossBoardDrop(draggingTask, b.id, col.id);
                        }
                        setDropOverBoard(null);
                        setDropOverCol(null);
                      }}
                    >
                      <div style={{ width: 8, height: 8, borderRadius: '50%', background: col.color || '#aaa', flexShrink: 0 }} />
                      {col.title}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {creating && (
          <div className="sidebar-create-input">
            <input
              ref={createRef}
              value={newName}
              onChange={(e) => setNewName(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') handleCreate(); if (e.key === 'Escape') { setCreating(false); setNewName(''); } }}
              onBlur={() => { if (!newName.trim()) { setCreating(false); setNewName(''); } }}
              placeholder="Project name..."
            />
          </div>
        )}
      </div>

      <div className="sidebar-section">
        <div className="sidebar-section-label">Views</div>
        {navItems.map(item => (
          <div
            key={item.id}
            className={`sidebar-item ${activeView === item.id ? 'active' : ''}`}
            onClick={() => onViewChange(item.id)}
          >
            <item.icon />
            {item.label}
          </div>
        ))}
      </div>

      <div className="sidebar-spacer" />
      <div className="sidebar-footer">Starchild Work</div>
    </div>
  );
}

// ============================================================
// Main App
// ============================================================
function App() {
  const [loading, setLoading] = useState(true);
  const [boards, setBoards] = useState([]);
  const [lists, setLists] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [activeBoard, setActiveBoard] = useState(null);
  const [activeView, setActiveView] = useState('board');
  const [selectedTask, setSelectedTask] = useState(null);
  const [allLists, setAllLists] = useState({}); // board_id -> lists[]
  const [draggingTask, setDraggingTask] = useState(null); // task being dragged

  const [searchText, setSearchText] = useState('');
  const [dueDateFilter, setDueDateFilter] = useState('all');
  const [priorityFilter, setPriorityFilter] = useState('all');
  const [ownerFilter, setOwnerFilter] = useState('all');
  const [sortBy, setSortBy] = useState('default');

  const loadBoards = useCallback(async () => {
    const boardsRes = await api('/ajax/tasks/board/get');
    const boardList = boardsRes.data || [];
    setBoards(boardList);
    return boardList;
  }, []);

  const switchBoard = useCallback(async (board) => {
    setActiveBoard(board);
    setActiveView('board');
    const [listsRes, tasksRes] = await Promise.all([
      api('/ajax/tasks/list/get', { options: { board_id: board.id } }),
      api('/ajax/tasks/task/get', { options: { board_id: board.id } }),
    ]);
    setLists(listsRes.data || []);
    setTasks(tasksRes.data || []);
  }, []);

  const loadData = useCallback(async () => {
    try {
      const boardList = await loadBoards();
      if (boardList.length > 0) {
        await switchBoard(boardList[0]);
        // Pre-fetch columns for all boards so cross-board drop targets are ready
        const entries = await Promise.all(
          boardList.map(b => api('/ajax/tasks/list/get', { options: { board_id: b.id } })
            .then(r => [b.id, r.data || []]))
        );
        setAllLists(Object.fromEntries(entries));
      }
    } catch (err) {
      console.error('Failed to load data:', err);
    } finally {
      setLoading(false);
    }
  }, [loadBoards, switchBoard]);

  useEffect(() => { loadData(); }, [loadData]);

  useEffect(() => { loadData(); }, [loadData]);

  const createBoard = async (title) => {
    const frontId = genId();
    const board = {
      front_id: frontId,
      workspace_id: 'ws-001',
      title,
      emoji: '',
      view_mode: 'grid',
      active_tasks: 0,
      connectors: [],
    };
    const res = await api('/ajax/tasks/board/save', { object: board });
    const saved = res.data?.object;
    if (saved) {
      // Create default columns for the new board
      const colors = ['#BDBDBD', '#f84600', '#ff8607', '#04aa11'];
      const names = ['To Do', 'In Progress', 'In Review', 'Done'];
      const orders = ['b', 'd', 'f', 'h'];
      for (let i = 0; i < names.length; i++) {
        await api('/ajax/tasks/list/save', { object: {
          front_id: genId(), board_id: saved.id, title: names[i], color: colors[i], order: orders[i],
        }});
      }
      setBoards(prev => [...prev, saved]);
      await switchBoard(saved);
    }
  };

  const renameBoard = async (boardId, newTitle) => {
    if (!newTitle.trim()) return;
    const board = boards.find(b => b.id === boardId);
    if (!board) return;
    const updated = { ...board, title: newTitle.trim() };
    setBoards(prev => prev.map(b => b.id === boardId ? updated : b));
    if (activeBoard && activeBoard.id === boardId) setActiveBoard(updated);
    await api('/ajax/tasks/board/save', { object: updated });
  };

  const deleteBoardById = async (boardId) => {
    await api('/ajax/tasks/board/remove', { object: { id: boardId } });
    setBoards(prev => {
      const remaining = prev.filter(b => b.id !== boardId);
      if (activeBoard && activeBoard.id === boardId && remaining.length > 0) {
        switchBoard(remaining[0]);
      }
      return remaining;
    });
  };

  // Collect unique owner names across all tasks for the owner dropdown
  const allOwners = useMemo(() => {
    const names = new Set();
    tasks.forEach(t => (t.participants || []).forEach(p => {
      if (p.user_id_or_mail) names.add(p.user_id_or_mail);
    }));
    return [...names].sort();
  }, [tasks]);

  const filteredTasks = useMemo(() => {
    let result = [...tasks];

    // Search: title, tags, description, owners
    if (searchText.trim()) {
      const q = searchText.toLowerCase();
      result = result.filter(t =>
        t.title.toLowerCase().includes(q) ||
        (t.tags || []).some(tag => tag.toLowerCase().includes(q)) ||
        ((t.description || {}).original_str || '').toLowerCase().includes(q) ||
        (t.participants || []).some(p => (p.user_id_or_mail || '').toLowerCase().includes(q))
      );
    }

    // Due date filter
    const now = Math.floor(Date.now() / 1000);
    if (dueDateFilter === 'overdue') {
      result = result.filter(t => t.before && t.before < now);
    } else if (dueDateFilter === 'this_week') {
      const weekEnd = now + 7 * 86400;
      result = result.filter(t => t.before && t.before >= now && t.before <= weekEnd);
    } else if (dueDateFilter === 'no_date') {
      result = result.filter(t => !t.before);
    }

    // Priority filter
    if (priorityFilter !== 'all') {
      result = result.filter(t => ((t._custom_fields || {}).priority || '') === priorityFilter);
    }

    // Owner filter
    if (ownerFilter !== 'all') {
      result = result.filter(t =>
        (t.participants || []).some(p => p.user_id_or_mail === ownerFilter)
      );
    }

    // Sort
    if (sortBy === 'title') {
      result.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    } else if (sortBy === 'due_date') {
      result.sort((a, b) => {
        if (!a.before && !b.before) return 0;
        if (!a.before) return 1;
        if (!b.before) return -1;
        return a.before - b.before;
      });
    } else if (sortBy === 'priority') {
      const ORDER = { high: 0, medium: 1, low: 2, '': 3 };
      result.sort((a, b) => {
        const pa = ORDER[(a._custom_fields || {}).priority || ''] ?? 3;
        const pb = ORDER[(b._custom_fields || {}).priority || ''] ?? 3;
        return pa - pb;
      });
    }

    return result;
  }, [tasks, searchText, dueDateFilter, priorityFilter, ownerFilter, sortBy]);

  const saveTask = async (task) => {
    const res = await api('/ajax/tasks/task/save', { object: task });
    const saved = res.data?.object;
    if (saved) {
      setTasks(prev => {
        const idx = prev.findIndex(t => t.id === saved.id || t.front_id === saved.front_id);
        if (idx >= 0) {
          const updated = [...prev];
          updated[idx] = { ...updated[idx], ...saved };
          return updated;
        }
        return [...prev, saved];
      });
    }
  };

  // Move a task to a column on a DIFFERENT board
  const moveTaskCrossBoard = async (task, targetBoardId, targetListId) => {
    if (!task) return;
    const updated = { ...task, board_id: targetBoardId, list_id: targetListId };
    await api('/ajax/tasks/task/save', { object: updated });
    // Remove from current board's local state
    setTasks(prev => prev.filter(t => t.id !== task.id));
  };

  const deleteTask = async (task) => {
    await api('/ajax/tasks/task/remove', { object: { id: task.id, front_id: task.front_id } });
    setTasks(prev => prev.filter(t => t.id !== task.id));
  };

  const addTask = async (listId, title) => {
    if (!activeBoard) return;
    const frontId = genId();
    const existingTasks = tasks.filter(t => t.list_id === listId);
    const maxOrder = existingTasks.reduce((max, t) => {
      const o = t.order || '';
      return o > max ? o : max;
    }, '');
    const newOrder = maxOrder ? maxOrder + 'b' : 'b';

    const task = {
      front_id: frontId,
      board_id: activeBoard.id,
      list_id: listId,
      title,
      description: { original_str: '' },
      order: newOrder,
      archived: false,
      tags: [],
      participants: [],
      checklist: [],
      before: 0,
      start: Math.floor(Date.now() / 1000),
      _custom_fields: {},
    };
    setTasks(prev => [...prev, { ...task, id: frontId }]);
    const res = await api('/ajax/tasks/task/save', { object: task });
    const saved = res.data?.object;
    if (saved) {
      setTasks(prev => prev.map(t => (t.front_id === frontId ? { ...t, ...saved } : t)));
    }
  };

  const addColumn = async (title) => {
    if (!activeBoard) return;
    const frontId = genId();
    const maxOrder = lists.reduce((max, l) => {
      const o = l.order || '';
      return o > max ? o : max;
    }, '');
    const newOrder = maxOrder ? maxOrder + 'b' : 'b';
    const colorIdx = lists.length % COLUMN_COLORS.length;

    const list = {
      front_id: frontId,
      board_id: activeBoard.id,
      title,
      color: COLUMN_COLORS[colorIdx],
      order: newOrder,
    };
    setLists(prev => [...prev, { ...list, id: frontId }]);
    const res = await api('/ajax/tasks/list/save', { object: list });
    const saved = res.data?.object;
    if (saved) {
      setLists(prev => prev.map(l => (l.front_id === frontId ? { ...l, ...saved } : l)));
      setAllLists(prev => ({
        ...prev,
        [activeBoard.id]: [...(prev[activeBoard.id] || []), saved],
      }));
    }
  };

  const deleteColumn = async (listId) => {
    await api('/ajax/tasks/list/remove', { object: { id: listId } });
    setLists(prev => prev.filter(l => l.id !== listId));
    setTasks(prev => prev.filter(t => t.list_id !== listId));
  };

  const renameColumn = async (listId, newTitle) => {
    const list = lists.find(l => l.id === listId);
    if (!list || !newTitle.trim()) return;
    const updated = { ...list, title: newTitle.trim() };
    setLists(prev => prev.map(l => l.id === listId ? updated : l));
    await api('/ajax/tasks/list/save', { object: updated });
  };

  const reorderColumn = async (draggedId, targetId) => {
    const sorted = [...lists].sort((a, b) => (a.order || '').localeCompare(b.order || ''));
    const fromIdx = sorted.findIndex(l => l.id === draggedId);
    const toIdx   = sorted.findIndex(l => l.id === targetId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const reordered = [...sorted];
    const [moved] = reordered.splice(fromIdx, 1);
    reordered.splice(toIdx, 0, moved);
    // Assign new simple order strings a < b < c ...
    const letters = 'bcdefghijklmnopqrstuvwxyz';
    const updated = reordered.map((l, i) => ({ ...l, order: letters[i] || String.fromCharCode(98 + i) }));
    setLists(updated);
    await Promise.all(updated.map(l => api('/ajax/tasks/list/save', { object: l })));
  };

  const onCardClick = (task) => {
    const latest = tasks.find(t => t.id === task.id) || task;
    setSelectedTask(latest);
  };

  const views = [
    { id: 'board', label: 'Board', icon: Icons.Board },
    { id: 'list', label: 'List', icon: Icons.List },
    { id: 'calendar', label: 'Calendar', icon: Icons.Calendar },
    { id: 'timeline', label: 'Timeline', icon: Icons.Timeline },
    { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
    { id: 'overview', label: 'Overview', icon: Icons.Overview },
  ];

  const totalActiveTasks = tasks.filter(t => !t.archived).length;

  if (loading) {
    return <div className="loading"><div className="spinner" /><span>Loading board...</span></div>;
  }

  return (
    <>
      {/* Sidebar */}
      <Sidebar
        boards={boards}
        activeBoard={activeBoard}
        taskCount={totalActiveTasks}
        activeView={activeView}
        onViewChange={setActiveView}
        onBoardSelect={switchBoard}
        onCreateBoard={createBoard}
        onDeleteBoard={deleteBoardById}
        onRenameBoard={renameBoard}
        allLists={allLists}
        draggingTask={draggingTask}
        onCrossBoardDrop={moveTaskCrossBoard}
      />

      {/* Main Content */}
      <div className="main-content">
        {/* Top Bar */}
        <div className="topbar">
          <div className="topbar-inner">
            <div className="topbar-title">
              {activeBoard?.title || 'Project Board'}
            </div>
            <span className="topbar-task-count">{totalActiveTasks} tasks</span>
          </div>
        </div>

        {/* View Tabs */}
        <div className="view-tabs">
          {views.map(v => (
            <div key={v.id} className={`view-tab ${activeView === v.id ? 'active' : ''}`} onClick={() => setActiveView(v.id)}>
              <v.icon /> {v.label}
            </div>
          ))}
        </div>

        {/* Filter Bar */}
        <div className="filter-bar">
          <div className="filter-search">
            <Icons.Search />
            <input
              value={searchText}
              onChange={(e) => setSearchText(e.target.value)}
              placeholder="Search tasks..."
            />
          </div>
          <div className="filter-divider" />
          <span className="filter-label">Due</span>
          <select className="filter-select" value={dueDateFilter} onChange={(e) => setDueDateFilter(e.target.value)}>
            <option value="all">All dates</option>
            <option value="overdue">Overdue</option>
            <option value="this_week">This week</option>
            <option value="no_date">No date</option>
          </select>
          <div className="filter-divider" />
          <span className="filter-label">Priority</span>
          <select className="filter-select" value={priorityFilter} onChange={(e) => setPriorityFilter(e.target.value)}>
            <option value="all">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <div className="filter-divider" />
          <span className="filter-label">Owner</span>
          <select className="filter-select" value={ownerFilter} onChange={(e) => setOwnerFilter(e.target.value)}>
            <option value="all">Anyone</option>
            {allOwners.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <div className="filter-divider" />
          <span className="filter-label">Sort</span>
          <select className="filter-select" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
            <option value="default">Default order</option>
            <option value="title">By title</option>
            <option value="due_date">By due date</option>
            <option value="priority">By priority</option>
          </select>
        </div>

        {/* Views */}
        {activeView === 'board' && (
          <BoardView
            lists={lists}
            tasks={filteredTasks}
            onCardClick={onCardClick}
            onAddTask={addTask}
            onAddColumn={addColumn}
            onSaveTask={saveTask}
            onDeleteColumn={deleteColumn}
            onRenameColumn={renameColumn}
            onReorderColumn={reorderColumn}
            onDragStart={setDraggingTask}
            onDragEnd={() => setDraggingTask(null)}
          />
        )}
        {activeView === 'list' && (
          <ListView lists={lists} tasks={filteredTasks} onCardClick={onCardClick}
            onDragStart={setDraggingTask} onDragEnd={() => setDraggingTask(null)} />
        )}
        {activeView === 'calendar' && (
          <CalendarView tasks={filteredTasks} lists={lists} onCardClick={onCardClick} onSaveTask={saveTask} />
        )}
        {activeView === 'timeline' && (
          <TimelineView tasks={filteredTasks} lists={lists} onCardClick={onCardClick} />
        )}
        {activeView === 'dashboard' && (
          <DashboardView tasks={filteredTasks} lists={lists} />
        )}
        {activeView === 'overview' && (
          <OverviewView tasks={filteredTasks} lists={lists} board={activeBoard} />
        )}
      </div>

      {/* Task Modal */}
      {selectedTask && (
        <TaskModal
          task={selectedTask}
          lists={lists}
          onClose={() => setSelectedTask(null)}
          onSave={saveTask}
          onDelete={deleteTask}
        />
      )}
    </>
  );
}

// ============================================================
// Render
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
